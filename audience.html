<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxer — Participar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f5ef;--surface:#fff;--border:#e0dbd0;--border2:#ccc8bc;--text:#1a1814;--muted:#8a8478;--accent:#d4760a;--accent2:#1a6fd4;--green:#1d8a52;--red:#c43030;}
body{font-family:'Fira Code',monospace;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(212,118,10,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(212,118,10,.05) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.5rem;background:var(--surface);border-bottom:1.5px solid var(--border);position:relative;z-index:10;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;letter-spacing:-.02em;}
.logo .x{color:var(--accent);}
.stag{display:flex;align-items:center;gap:.5rem;font-size:.68rem;color:var(--muted);}
.stag .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.4s ease infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.stag strong{color:var(--text);font-size:.9rem;letter-spacing:.15em;}
.btn-sm{padding:.38rem .75rem;border-radius:3px;font-family:'Fira Code',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;}
.btn-sm:hover{border-color:var(--text);color:var(--text);}

/* PROGRESS */
.prog-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:.6rem 1.5rem;display:none;align-items:center;gap:1rem;position:relative;z-index:10;}
.prog-bar.on{display:flex;}
.prog-lbl{font-size:.65rem;color:var(--muted);letter-spacing:.08em;white-space:nowrap;}
.prog-track{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s ease;}

/* SCREENS */
.screen{display:none;flex:1;align-items:center;justify-content:center;padding:2rem;position:relative;z-index:1;}
.screen.on{display:flex;}

/* JOIN */
.jcard{background:var(--surface);border:1.5px solid var(--border);border-radius:4px;padding:2.5rem;width:100%;max-width:380px;box-shadow:5px 5px 0 var(--border);animation:up .35s ease both;}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.jcard h2{font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;line-height:1.2;margin-bottom:.3rem;}
.jcard h2 em{color:var(--accent);font-style:italic;}
.jcard .sub{font-size:.7rem;color:var(--muted);margin-bottom:2rem;line-height:1.6;}
.fg{margin-bottom:1.1rem;}
label{display:block;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem;}
input[type=text]{width:100%;padding:.7rem .9rem;background:var(--bg);border:1.5px solid var(--border);border-radius:3px;color:var(--text);font-family:'Fira Code',monospace;font-size:.9rem;outline:none;transition:border-color .2s;}
input:focus{border-color:var(--text);}
.code-field{font-size:2rem;font-weight:500;letter-spacing:.3em;text-align:center;text-transform:uppercase;padding:.6rem;}
.btn-join{width:100%;padding:.9rem;background:var(--text);color:var(--bg);border:none;border-radius:3px;font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .2s;margin-top:.25rem;}
.btn-join:hover{background:var(--accent);}
.btn-join:disabled{opacity:.45;cursor:not-allowed;background:var(--text);}
.err{color:var(--red);font-size:.72rem;text-align:center;margin-top:.65rem;min-height:1em;}

/* WAITING */
.wbox{text-align:center;max-width:420px;}
.wicon{font-size:3rem;margin-bottom:1.5rem;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.wbox h2{font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;margin-bottom:.5rem;}
.wbox p{font-size:.72rem;color:var(--muted);}
.pdots{display:flex;gap:.4rem;justify-content:center;margin-top:1.75rem;}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:pdot 1.4s ease infinite;}
.pdot:nth-child(2){animation-delay:.2s;}.pdot:nth-child(3){animation-delay:.4s;}
@keyframes pdot{0%,100%{transform:scale(.6);opacity:.35}50%{transform:scale(1);opacity:1}}

/* QUESTION */
.qwrap{width:100%;max-width:580px;display:flex;flex-direction:column;gap:1.1rem;}
.qcard{background:var(--surface);border:1.5px solid var(--border);border-radius:4px;padding:2.25rem;box-shadow:5px 5px 0 var(--border);animation:up .3s ease both;}
.qtag{display:inline-block;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;padding:.2rem .55rem;border-radius:2px;margin-bottom:.9rem;}
.qt-multiple_choice{background:rgba(26,111,212,.1);color:var(--accent2);border:1px solid rgba(26,111,212,.2);}
.qt-word_cloud{background:rgba(29,138,82,.1);color:var(--green);border:1px solid rgba(29,138,82,.2);}
.qt-open_text{background:rgba(196,48,48,.1);color:var(--red);border:1px solid rgba(196,48,48,.2);}
.qt-rating{background:rgba(212,118,10,.1);color:var(--accent);border:1px solid rgba(212,118,10,.2);}
.qtext{font-family:'Syne',sans-serif;font-weight:700;font-size:1.65rem;line-height:1.3;}

.mc-list{display:flex;flex-direction:column;gap:.65rem;margin-top:1.5rem;}
.mc-opt{display:flex;align-items:center;gap:.75rem;padding:.9rem 1.1rem;border:1.5px solid var(--border);border-radius:3px;background:var(--bg);cursor:pointer;font-size:.88rem;transition:all .15s;}
.mc-opt:hover{border-color:var(--text);transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--border);}
.mc-opt.sel{border-color:var(--text);background:var(--text);color:var(--bg);}
.mc-letter{width:24px;height:24px;border-radius:2px;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:.65rem;flex-shrink:0;}

.rrow{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center;margin-top:1.5rem;}
.rbtn{width:50px;height:50px;border-radius:3px;border:1.5px solid var(--border);background:var(--bg);font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.rbtn:hover{border-color:var(--text);transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--border);}
.rbtn.sel{border-color:var(--text);background:var(--text);color:var(--bg);}

.tarea{margin-top:1.5rem;}
textarea{width:100%;padding:.75rem .9rem;background:var(--bg);border:1.5px solid var(--border);border-radius:3px;color:var(--text);font-family:'Fira Code',monospace;font-size:.87rem;outline:none;resize:vertical;min-height:96px;transition:border-color .2s;}
textarea:focus{border-color:var(--text);}
.word-inp{font-size:1.1rem;letter-spacing:.06em;}

.btn-sub{width:100%;padding:.95rem;background:var(--text);color:var(--bg);border:none;border-radius:3px;font-family:'Syne',sans-serif;font-weight:700;font-size:.88rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.btn-sub:hover:not(:disabled){background:var(--green);}
.btn-sub:disabled{opacity:.45;cursor:not-allowed;}

/* Done card (after answering) */
.done-card{background:var(--surface);border:1.5px solid var(--green);border-radius:4px;padding:1.75rem;text-align:center;box-shadow:4px 4px 0 rgba(29,138,82,.2);animation:up .3s ease both;}
.done-icon{font-size:2rem;margin-bottom:.6rem;}
.done-card h3{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;margin-bottom:.25rem;}
.done-card p{font-size:.7rem;color:var(--muted);}

/* RESULTS shown to audience */
.res-card{background:var(--surface);border:1.5px solid var(--border);border-radius:4px;padding:1.5rem;animation:up .3s ease both;}
.res-card h4{font-family:'Syne',sans-serif;font-weight:700;font-size:.85rem;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;}
.res-card h4 .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.4s ease infinite;display:inline-block;}
.chart-wrap{position:relative;height:180px;}
.wcloud{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;min-height:90px;padding:.6rem;}
.wtag{padding:.25rem .6rem;border-radius:3px;font-family:'Syne',sans-serif;font-weight:700;animation:pop .3s cubic-bezier(.175,.885,.32,1.275) both;}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.resp-list{display:flex;flex-direction:column;gap:.35rem;max-height:180px;overflow-y:auto;}
.resp-item{padding:.45rem .8rem;background:var(--bg);border-left:2px solid var(--accent2);font-size:.78rem;}
.rbars{display:flex;flex-direction:column;gap:.45rem;}
.rbar-row{display:flex;align-items:center;gap:.6rem;}
.rbar-lbl{font-size:.7rem;color:var(--muted);width:1.3rem;text-align:center;}
.rbar-track{flex:1;height:14px;background:var(--border);border-radius:2px;overflow:hidden;}
.rbar-fill{height:100%;background:linear-gradient(90deg,var(--accent2),#80c4ff);border-radius:2px;transition:width .6s ease;}
.rbar-n{font-size:.65rem;color:var(--muted);width:1.6rem;text-align:right;}

/* End */
.end-card{background:var(--surface);border:1.5px solid var(--border);border-radius:4px;padding:2.5rem;text-align:center;max-width:400px;box-shadow:5px 5px 0 var(--border);animation:up .3s ease both;}
.end-icon{font-size:3rem;margin-bottom:1rem;}
.end-card h2{font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem;margin-bottom:.5rem;}
.end-card p{font-size:.72rem;color:var(--muted);}

.btmbar{border-top:1px solid var(--border);padding:.7rem 1.5rem;display:flex;justify-content:flex-end;background:var(--surface);position:relative;z-index:10;}

#loader{display:none;position:fixed;inset:0;background:rgba(247,245,239,.8);z-index:400;align-items:center;justify-content:center;}
#loader.on{display:flex;}
.spin{width:30px;height:30px;border:2px solid var(--border2);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Vo<span class="x">x</span>er</div>
  <div class="stag" id="stag" style="display:none">
    <span class="dot"></span>
    <strong id="stag-code">——</strong>
    <span id="stag-title" style="color:var(--muted);font-size:.65rem;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></span>
  </div>
  <button class="btn-sm" id="btn-leave" style="display:none" onclick="leaveSession()">← Sair</button>
</div>

<div class="prog-bar" id="prog-bar">
  <span class="prog-lbl" id="prog-lbl">Pergunta 1 de 1</span>
  <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <span class="prog-lbl" id="prog-ans" style="text-align:right;"></span>
</div>

<!-- JOIN -->
<div class="screen on" id="sc-join">
  <div class="jcard">
    <h2>Entrar no<br><em>questionário</em></h2>
    <p class="sub">Não precisas de conta. Introduz o código partilhado pelo apresentador.</p>
    <div class="fg">
      <label>O teu nome (opcional)</label>
      <input type="text" id="join-name" placeholder="Anónimo">
    </div>
    <div class="fg">
      <label>Código do questionário</label>
      <input class="code-field" id="join-code" type="text" maxlength="6" placeholder="ABC123" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn-join" onclick="joinByCode()">Entrar</button>
    <p class="err" id="join-err"></p>
  </div>
</div>

<!-- WAITING -->
<div class="screen" id="sc-wait">
  <div class="wbox">
    <div class="wicon">🎙️</div>
    <h2>Aguarda o apresentador</h2>
    <p>A próxima pergunta aparece aqui automaticamente.</p>
    <div class="pdots"><div class="pdot"></div><div class="pdot"></div><div class="pdot"></div></div>
  </div>
</div>

<!-- QUESTION -->
<div class="screen" id="sc-question" style="flex-direction:column;align-items:center;">
  <div class="qwrap" id="qwrap"></div>
</div>

<!-- END -->
<div class="screen" id="sc-end">
  <div class="end-card">
    <div class="end-icon">🎉</div>
    <h2>Obrigado!</h2>
    <p>O questionário terminou. Obrigado pela tua participação.</p>
  </div>
</div>

<div class="btmbar" id="btmbar" style="display:none;">
  <button class="btn-sm" onclick="leaveSession()">← Outro código</button>
</div>

<div id="loader"><div class="spin"></div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ⚠️  SUBSTITUI PELOS TEUS VALORES
const SUPABASE_URL = 'https://afdesdgltdsfwkburmuc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmZGVzZGdsdGRzZndrYnVybXVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MzcwMTgsImV4cCI6MjA4OTAxMzAxOH0.bdyHF7EODlXW0GyKLdeKLzsmIGNGGc3qC13ogM5amEY';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// Token anónimo persistente por browser
let anonToken = localStorage.getItem('voxer_token');
if(!anonToken){ anonToken = crypto.randomUUID(); localStorage.setItem('voxer_token', anonToken); }

let userName = localStorage.getItem('voxer_name') || '';
let activeQuiz = null;
let questions = [];
let answeredIds = new Set();
let currentQ = null;
let quizSub = null;
let respSub = null;
let selAnswer = null;
let audienceChart = null;

// URL code
const params = new URLSearchParams(location.search);
const urlCode = params.get('code');
if(urlCode){ document.getElementById('join-code').value=urlCode.toUpperCase(); }
if(userName) document.getElementById('join-name').value = userName;

// ── JOIN ──────────────────────────────────────────────────
window.joinByCode = async ()=>{
  const code = document.getElementById('join-code').value.trim().toUpperCase();
  const name = document.getElementById('join-name').value.trim() || 'Anónimo';
  const errEl = document.getElementById('join-err');
  errEl.textContent='';
  if(code.length!==6){errEl.textContent='O código tem 6 caracteres.';return;}

  loading(true);
  // Supabase anon auth para RLS funcionar
  const {data:{session}} = await sb.auth.getSession();
  if(!session) await sb.auth.signInAnonymously();

  const {data:quizzes,error} = await sb.from('quizzes')
    .select('*').eq('live_code',code).eq('is_live',true);

  if(error||!quizzes?.length){
    errEl.textContent='Código não encontrado ou questionário já não está activo.';
    loading(false);return;
  }

  activeQuiz = quizzes[0];
  userName = name;
  localStorage.setItem('voxer_name', name);

  const {data:qs} = await sb.from('questions')
    .select('*').eq('quiz_id',activeQuiz.id).order('q_order');
  questions = qs||[];

  // Quais já respondeu (por token anónimo)
  if(questions.length){
    const {data:rs} = await sb.from('responses')
      .select('question_id').eq('quiz_id',activeQuiz.id).eq('audience_token',anonToken);
    (rs||[]).forEach(r=>answeredIds.add(r.question_id));
  }

  document.getElementById('stag-code').textContent = code;
  document.getElementById('stag-title').textContent = activeQuiz.title;
  document.getElementById('stag').style.display='flex';
  document.getElementById('btmbar').style.display='flex';
  document.getElementById('btn-leave').style.display='block';

  loading(false);
  subscribeQuiz();
  showActiveQuestion();
};

// ── SUBSCRIBE ─────────────────────────────────────────────
function subscribeQuiz(){
  if(quizSub){sb.removeChannel(quizSub);quizSub=null;}
  quizSub = sb.channel('aud-'+activeQuiz.id)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'quizzes',filter:`id=eq.${activeQuiz.id}`},
      async(payload)=>{
        const prev = activeQuiz;
        activeQuiz = payload.new;
        if(!activeQuiz.is_live){ sc('sc-end'); document.getElementById('prog-bar').classList.remove('on'); return; }
        // Pergunta mudou OU visibilidade de resultados mudou
        if(activeQuiz.active_question_id !== prev.active_question_id){
          showActiveQuestion();
        } else if(activeQuiz.show_results !== prev.show_results){
          // Apenas actualiza a secção de resultados sem re-renderizar tudo
          if(activeQuiz.show_results) showLiveResults();
          else hideLiveResults();
        }
      })
    .subscribe();
}

function subscribeResponses(){
  if(respSub){sb.removeChannel(respSub);respSub=null;}
  if(!activeQuiz?.active_question_id||!activeQuiz.show_results) return;
  loadLiveResponses();
  respSub = sb.channel('aud-resp-'+activeQuiz.active_question_id)
    .on('postgres_changes',{event:'*',schema:'public',table:'responses',filter:`question_id=eq.${activeQuiz.active_question_id}`},
      ()=>loadLiveResponses())
    .subscribe();
}

// ── SHOW QUESTION ─────────────────────────────────────────
function showActiveQuestion(){
  if(!activeQuiz?.active_question_id){ sc('sc-wait'); updateProg(); return; }
  currentQ = questions.find(q=>q.id===activeQuiz.active_question_id)||null;
  if(!currentQ){ sc('sc-wait'); return; }
  selAnswer=null;
  updateProg();
  sc('sc-question');
  renderQuestion();
  if(activeQuiz.show_results) subscribeResponses();
}

function renderQuestion(){
  const wrap = document.getElementById('qwrap');
  wrap.innerHTML = '';

  // Question card
  const labels={multiple_choice:'Múltipla escolha',word_cloud:'Nuvem de palavras',open_text:'Pergunta aberta',rating:'Escala de avaliação'};
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const q = currentQ;
  const done = answeredIds.has(q.id);

  if(done){
    wrap.innerHTML = doneHTML(q) + (activeQuiz.show_results ? '<div id="res-section"></div>' : '');
    if(activeQuiz.show_results) subscribeResponses();
    return;
  }

  let bodyHTML='';
  if(q.type==='multiple_choice'){
    bodyHTML=`<div class="mc-list">${(q.options||[]).map((o,i)=>`
      <div class="mc-opt" onclick="pickMC(this,'${esc(o)}')">
        <span class="mc-letter">${letters[i]}</span>${o}
      </div>`).join('')}</div>`;
  }
  if(q.type==='word_cloud'){
    bodyHTML=`<div class="tarea"><input class="word-inp" type="text" id="ans-input" maxlength="30" placeholder="Uma palavra..." oninput="selAnswer=this.value.trim();toggleSub()"></div>`;
  }
  if(q.type==='open_text'){
    bodyHTML=`<div class="tarea"><textarea id="ans-input" placeholder="A tua resposta..." oninput="selAnswer=this.value.trim();toggleSub()"></textarea></div>`;
  }
  if(q.type==='rating'){
    const max=q.rating_max||5;
    bodyHTML=`<div class="rrow">${Array.from({length:max},(_,i)=>i+1).map(n=>`<button class="rbtn" onclick="pickRating(this,${n})">${n}</button>`).join('')}</div>`;
  }

  wrap.innerHTML=`
    <div class="qcard">
      <span class="qtag qt-${q.type}">${labels[q.type]||q.type}</span>
      <div class="qtext">${q.question}</div>
      ${bodyHTML}
    </div>
    <button class="btn-sub" id="btn-sub" disabled onclick="submit()">Enviar resposta</button>
    ${activeQuiz.show_results?'<div id="res-section"></div>':''}
  `;
  if(activeQuiz.show_results) subscribeResponses();
}

function doneHTML(q){
  return `<div class="done-card">
    <div class="done-icon">✓</div>
    <h3>Respondido!</h3>
    <p>Aguarda que o apresentador avance.</p>
  </div>`;
}

// ── LIVE RESULTS (audience view) ──────────────────────────
function showLiveResults(){
  subscribeResponses();
  // Add results section if not present
  if(!document.getElementById('res-section')){
    const wrap=document.getElementById('qwrap');
    const div=document.createElement('div');
    div.id='res-section';
    wrap.appendChild(div);
  }
}

function hideLiveResults(){
  if(respSub){sb.removeChannel(respSub);respSub=null;}
  const sec=document.getElementById('res-section');
  if(sec) sec.remove();
  if(audienceChart){audienceChart.destroy();audienceChart=null;}
}

async function loadLiveResponses(){
  if(!activeQuiz?.active_question_id) return;
  const {data}=await sb.from('responses').select('answer').eq('question_id',activeQuiz.active_question_id);
  renderAudienceResults(data||[]);
}

function renderAudienceResults(rs){
  const sec=document.getElementById('res-section');
  if(!sec||!currentQ) return;
  const q=currentQ;
  const pal=['#1a6fd4','#d4760a','#1d8a52','#c43030','#7a4fd4','#d4a41a'];

  sec.innerHTML=`<div class="res-card">
    <h4><span class="live-dot"></span> Resultados — ${rs.length} resposta${rs.length!==1?'s':''}</h4>
    <div id="aud-res-body"></div>
  </div>`;

  const body=document.getElementById('aud-res-body');
  if(!rs.length){body.innerHTML='<p style="color:var(--muted);font-size:.72rem;">Sem respostas ainda...</p>';if(audienceChart){audienceChart.destroy();audienceChart=null;}return;}

  if(q.type==='multiple_choice'){
    const opts=q.options||[];const counts=Object.fromEntries(opts.map(o=>[o,0]));
    rs.forEach(r=>{if(counts[r.answer]!==undefined)counts[r.answer]++;});
    body.innerHTML='<div class="chart-wrap"><canvas id="aud-chart"></canvas></div>';
    if(audienceChart)audienceChart.destroy();
    audienceChart=new Chart(document.getElementById('aud-chart'),{
      type:'bar',
      data:{labels:opts,datasets:[{data:opts.map(o=>counts[o]),backgroundColor:pal.slice(0,opts.length),borderRadius:3,borderSkipped:false}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8a8478',font:{family:'Fira Code',size:11}},grid:{display:false}},y:{ticks:{color:'#8a8478',font:{family:'Fira Code',size:11},stepSize:1},grid:{color:'rgba(0,0,0,.06)'}}}}
    });
    return;
  }
  if(audienceChart){audienceChart.destroy();audienceChart=null;}

  if(q.type==='word_cloud'){
    const freq={};rs.forEach(r=>{const w=(r.answer||'').toLowerCase().trim();if(w)freq[w]=(freq[w]||0)+1;});
    const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,40);const max=sorted[0]?.[1]||1;
    body.innerHTML=`<div class="wcloud">${sorted.map(([w,n],i)=>{const sz=0.75+(n/max)*1.7;const c=pal[i%pal.length];return`<span class="wtag" style="font-size:${sz}rem;background:${c}15;color:${c};border:1px solid ${c}30;">${w} <small style="opacity:.5;font-size:.7em;">${n}</small></span>`;}).join('')}</div>`;
    return;
  }
  if(q.type==='open_text'){
    body.innerHTML=`<div class="resp-list">${rs.map(r=>`<div class="resp-item">${esc(r.answer)}</div>`).join('')}</div>`;
    return;
  }
  if(q.type==='rating'){
    const max=q.rating_max||5;const counts={};for(let i=1;i<=max;i++)counts[i]=0;
    rs.forEach(r=>{const v=parseInt(r.answer);if(counts[v]!==undefined)counts[v]++;});
    const maxC=Math.max(...Object.values(counts),1);
    const avg=rs.length?(rs.reduce((s,r)=>s+parseInt(r.answer||0),0)/rs.length).toFixed(1):'—';
    body.innerHTML=`<div style="font-size:.68rem;color:var(--muted);margin-bottom:.65rem;">Média: <strong style="color:var(--text);font-size:1rem;font-family:'Syne',sans-serif;">${avg}</strong></div>
      <div class="rbars">${Object.entries(counts).map(([n,c])=>`<div class="rbar-row"><span class="rbar-lbl">${n}</span><div class="rbar-track"><div class="rbar-fill" style="width:${(c/maxC)*100}%"></div></div><span class="rbar-n">${c}</span></div>`).join('')}</div>`;
  }
}

// ── INTERACTIONS ──────────────────────────────────────────
window.pickMC=(el,val)=>{document.querySelectorAll('.mc-opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');selAnswer=val;toggleSub();};
window.pickRating=(el,val)=>{document.querySelectorAll('.rbtn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');selAnswer=String(val);toggleSub();};
window.toggleSub=()=>{const btn=document.getElementById('btn-sub');if(btn)btn.disabled=!selAnswer;};

window.submit=async()=>{
  const answer=selAnswer||document.getElementById('ans-input')?.value?.trim();
  if(!answer||!currentQ)return;
  document.getElementById('btn-sub').disabled=true;
  loading(true);
  const {error}=await sb.from('responses').insert({
    question_id:currentQ.id,
    quiz_id:activeQuiz.id,
    audience_token:anonToken,
    answer
  });
  loading(false);
  if(error&&error.code!=='23505'){document.getElementById('btn-sub').disabled=false;return;}
  answeredIds.add(currentQ.id);
  updateProg();
  // Substitui só a parte do formulário pelo done, mantém resultados
  const wrap=document.getElementById('qwrap');
  const resSec=document.getElementById('res-section');
  wrap.innerHTML=doneHTML(currentQ);
  if(activeQuiz.show_results){
    const div=document.createElement('div');div.id='res-section';
    wrap.appendChild(div);
    subscribeResponses();
  }
};

// ── UTILS ─────────────────────────────────────────────────
function updateProg(){
  const bar=document.getElementById('prog-bar');
  if(!activeQuiz?.is_live||!questions.length){bar.classList.remove('on');return;}
  bar.classList.add('on');
  const idx=questions.findIndex(q=>q.id===activeQuiz?.active_question_id);
  const num=idx>=0?idx+1:0;
  document.getElementById('prog-lbl').textContent=`Pergunta ${num} de ${questions.length}`;
  document.getElementById('prog-fill').style.width=`${(num/questions.length)*100}%`;
  document.getElementById('prog-ans').textContent=`${answeredIds.size} respondida${answeredIds.size!==1?'s':''}`;
}

window.leaveSession=()=>{
  if(quizSub){sb.removeChannel(quizSub);quizSub=null;}
  if(respSub){sb.removeChannel(respSub);respSub=null;}
  activeQuiz=null;questions=[];answeredIds.clear();currentQ=null;selAnswer=null;
  if(audienceChart){audienceChart.destroy();audienceChart=null;}
  document.getElementById('stag').style.display='none';
  document.getElementById('btmbar').style.display='none';
  document.getElementById('btn-leave').style.display='none';
  document.getElementById('prog-bar').classList.remove('on');
  document.getElementById('join-code').value='';
  document.getElementById('join-err').textContent='';
  sc('sc-join');
};

function sc(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id)?.classList.add('on');}
function loading(v){document.getElementById('loader').classList.toggle('on',v);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

document.getElementById('join-code').addEventListener('keydown',e=>{if(e.key==='Enter')window.joinByCode();});

// Pre-fill se veio por URL
if(urlCode) window.joinByCode();
</script>
</body>
</html>
