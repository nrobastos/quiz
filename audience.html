<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxer — Audiência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f7f5ef;
  --surface:#ffffff;
  --border:#e0dbd0;
  --border2:#ccc8bc;
  --text:#1a1814;
  --muted:#8a8478;
  --accent:#d4760a;
  --accent2:#1a6fd4;
  --green:#1d8a52;
  --red:#c43030;
}

body{
  font-family:'Fira Code',monospace;
  background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;
}

body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(212,118,10,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(212,118,10,.05) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}

/* TOP */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.85rem 1.5rem;
  background:var(--surface);
  border-bottom:1.5px solid var(--border);
  position:relative;z-index:10;
}

.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;letter-spacing:-.02em;}
.logo .x{color:var(--accent);}

.session-tag{
  display:flex;align-items:center;gap:.5rem;
  font-size:.68rem;color:var(--muted);
}
.session-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.4s ease infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.session-tag strong{color:var(--text);font-size:.95rem;letter-spacing:.18em;}

.btn-sm{
  padding:.38rem .75rem;border-radius:3px;
  font-family:'Fira Code',monospace;font-size:.65rem;
  letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--border2);background:transparent;
  color:var(--muted);cursor:pointer;transition:all .15s;
}
.btn-sm:hover{border-color:var(--text);color:var(--text);}

/* SCREENS */
.screen{display:none;flex:1;align-items:center;justify-content:center;padding:2rem;position:relative;z-index:1;}
.screen.on{display:flex;}

/* ── JOIN ── */
.join-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:4px;padding:2.5rem;
  width:100%;max-width:380px;
  box-shadow:5px 5px 0 var(--border);
  animation:up .35s ease both;
}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.join-card h2{
  font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;
  line-height:1.2;margin-bottom:.3rem;
}
.join-card h2 em{color:var(--accent);font-style:italic;}
.join-card .sub{font-size:.7rem;color:var(--muted);margin-bottom:2rem;line-height:1.5;}

.fg{margin-bottom:1.1rem;}
label{display:block;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem;}
input{
  width:100%;padding:.7rem .9rem;
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:3px;color:var(--text);
  font-family:'Fira Code',monospace;font-size:.9rem;
  outline:none;transition:border-color .2s;
}
input:focus{border-color:var(--text);}

.code-field{
  font-size:2rem;font-weight:500;letter-spacing:.3em;
  text-align:center;text-transform:uppercase;
  padding:.6rem;
}

.btn-join{
  width:100%;padding:.9rem;
  background:var(--text);color:var(--bg);
  border:none;border-radius:3px;
  font-family:'Syne',sans-serif;font-weight:700;
  font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;transition:all .2s;margin-top:.25rem;
}
.btn-join:hover{background:var(--accent);}
.btn-join:disabled{opacity:.45;cursor:not-allowed;background:var(--text);}

.err-msg{color:var(--red);font-size:.72rem;text-align:center;margin-top:.65rem;min-height:1em;}

/* ── WAITING ── */
.waiting-box{text-align:center;max-width:420px;}
.w-icon{font-size:3rem;margin-bottom:1.5rem;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.waiting-box h2{font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;margin-bottom:.5rem;}
.waiting-box p{font-size:.72rem;color:var(--muted);}
.pulse-row{display:flex;gap:.4rem;justify-content:center;margin-top:1.75rem;}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:pdot 1.4s ease infinite;}
.pdot:nth-child(2){animation-delay:.2s;}.pdot:nth-child(3){animation-delay:.4s;}
@keyframes pdot{0%,100%{transform:scale(.6);opacity:.35}50%{transform:scale(1);opacity:1}}

/* ── QUESTION ── */
.q-wrap{width:100%;max-width:580px;}

.q-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:4px;padding:2.25rem;
  box-shadow:5px 5px 0 var(--border);
  margin-bottom:1.25rem;
  animation:up .3s ease both;
}

.q-type-tag{
  display:inline-block;font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;
  padding:.2rem .55rem;border-radius:2px;margin-bottom:.9rem;
}
.qt-multiple_choice{background:rgba(26,111,212,.1);color:var(--accent2);border:1px solid rgba(26,111,212,.2);}
.qt-word_cloud{background:rgba(29,138,82,.1);color:var(--green);border:1px solid rgba(29,138,82,.2);}
.qt-open_text{background:rgba(196,48,48,.1);color:var(--red);border:1px solid rgba(196,48,48,.2);}
.qt-rating{background:rgba(212,118,10,.1);color:var(--accent);border:1px solid rgba(212,118,10,.2);}

.q-text{
  font-family:'Syne',sans-serif;font-weight:700;
  font-size:1.65rem;line-height:1.3;color:var(--text);
}

/* Multiple choice */
.mc-list{display:flex;flex-direction:column;gap:.65rem;margin-top:1.5rem;}
.mc-opt{
  display:flex;align-items:center;gap:.75rem;
  padding:.9rem 1.1rem;
  border:1.5px solid var(--border);border-radius:3px;
  background:var(--bg);cursor:pointer;font-size:.88rem;
  transition:all .15s;
}
.mc-opt:hover{border-color:var(--text);transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--border);}
.mc-opt.sel{border-color:var(--text);background:var(--text);color:var(--bg);}
.mc-letter{
  width:24px;height:24px;border-radius:2px;
  border:1.5px solid currentColor;
  display:flex;align-items:center;justify-content:center;
  font-size:.65rem;flex-shrink:0;letter-spacing:.04em;
}

/* Rating */
.rating-row{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center;margin-top:1.5rem;}
.r-btn{
  width:50px;height:50px;border-radius:3px;
  border:1.5px solid var(--border);background:var(--bg);
  font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;
  cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;
}
.r-btn:hover{border-color:var(--text);transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--border);}
.r-btn.sel{border-color:var(--text);background:var(--text);color:var(--bg);}

/* Text */
.text-area{margin-top:1.5rem;}
textarea{
  width:100%;padding:.75rem .9rem;
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:3px;color:var(--text);
  font-family:'Fira Code',monospace;font-size:.87rem;
  outline:none;resize:vertical;min-height:96px;
  transition:border-color .2s;
}
textarea:focus{border-color:var(--text);}

.word-input{font-size:1.1rem;letter-spacing:.06em;}

/* Submit */
.btn-submit{
  width:100%;padding:.95rem;
  background:var(--text);color:var(--bg);
  border:none;border-radius:3px;
  font-family:'Syne',sans-serif;font-weight:700;
  font-size:.88rem;letter-spacing:.06em;text-transform:uppercase;
  cursor:pointer;transition:all .2s;
}
.btn-submit:hover:not(:disabled){background:var(--green);}
.btn-submit:disabled{opacity:.45;cursor:not-allowed;}

/* Done */
.done-card{
  background:var(--surface);
  border:1.5px solid var(--green);
  border-radius:4px;padding:2rem;
  text-align:center;
  box-shadow:4px 4px 0 rgba(29,138,82,.2);
  animation:up .3s ease both;
}
.done-icon{font-size:2.5rem;margin-bottom:.75rem;}
.done-card h3{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:.3rem;}
.done-card p{font-size:.72rem;color:var(--muted);}

/* Bottom bar */
.btmbar{
  border-top:1px solid var(--border);
  padding:.7rem 1.5rem;
  display:flex;justify-content:flex-end;gap:.6rem;
  background:var(--surface);position:relative;z-index:10;
}

/* Loader */
#loader{display:none;position:fixed;inset:0;background:rgba(247,245,239,.8);z-index:400;align-items:center;justify-content:center;}
#loader.on{display:flex;}
.spin{width:30px;height:30px;border:2px solid var(--border2);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Vo<span class="x">x</span>er</div>
  <div class="session-tag" id="session-tag" style="display:none">
    <span class="dot"></span>
    Código <strong id="tag-code">——</strong>
  </div>
  <div style="display:flex;gap:.5rem;align-items:center;">
    <span style="font-size:.65rem;color:var(--muted);" id="uname"></span>
    <button class="btn-sm" onclick="logout()">Sair</button>
  </div>
</div>

<!-- ECRÃ: entrar pelo código -->
<div class="screen on" id="sc-join">
  <div class="join-card">
    <h2>Entrar no<br><em>questionário</em></h2>
    <p class="sub">O apresentador partilhou um código de 6 caracteres quando iniciou o questionário. Introduz-o aqui.</p>
    <div class="fg">
      <label>Código do questionário</label>
      <input class="code-field" id="join-code" type="text" maxlength="6" placeholder="ABC123" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn-join" onclick="joinByCode()">Entrar</button>
    <p class="err-msg" id="join-err"></p>
  </div>
</div>

<!-- ECRÃ: a aguardar (questionário parado) -->
<div class="screen" id="sc-wait">
  <div class="waiting-box">
    <div class="w-icon">🎙️</div>
    <h2>Aguarda o apresentador</h2>
    <p>O questionário ficou pausado. Será redirecccionado quando reiniciar.</p>
    <div class="pulse-row"><div class="pdot"></div><div class="pdot"></div><div class="pdot"></div></div>
  </div>
</div>

<!-- ECRÃ: responder à pergunta -->
<div class="screen" id="sc-question" style="flex-direction:column;">
  <div class="q-wrap" id="q-wrap"><!-- preenchido dinamicamente --></div>
</div>

<div class="btmbar" id="btmbar" style="display:none;">
  <button class="btn-sm" onclick="leaveSession()">← Outro código</button>
</div>

<div id="loader"><div class="spin"></div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ⚠️  SUBSTITUI PELOS TEUS VALORES
const SUPABASE_URL = 'https://afdesdgltdsfwkburmuc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmZGVzZGdsdGRzZndrYnVybXVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MzcwMTgsImV4cCI6MjA4OTAxMzAxOH0.bdyHF7EODlXW0GyKLdeKLzsmIGNGGc3qC13ogM5amEY';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;
let activeQuiz = null;   // o quiz activo encontrado pelo código
let quizSub = null;      // realtime: monitoriza mudanças no quiz (stop/start)
let answered = false;
let selAnswer = null;

// ── AUTH ──────────────────────────────────────────────────

const {data:{session}} = await sb.auth.getSession();
if(!session){ location.href='index.html'; }
user = session.user;

const {data:profile} = await sb.from('profiles').select('name,role').eq('id',user.id).single();
if(profile?.role==='presenter'){ location.href='presenter.html'; }
document.getElementById('uname').textContent = profile?.name || user.email;

// Pre-fill code from URL
const params = new URLSearchParams(location.search);
const urlCode = params.get('code');
if(urlCode){
  document.getElementById('join-code').value = urlCode.toUpperCase();
  joinByCode();
}

// ── JOIN BY CODE ──────────────────────────────────────────

window.joinByCode = async ()=>{
  const code = document.getElementById('join-code').value.trim().toUpperCase();
  const errEl = document.getElementById('join-err');
  errEl.textContent='';
  if(code.length!==6){ errEl.textContent='O código tem 6 caracteres.'; return; }

  loading(true);

  // Procura quiz activo com este código
  const {data:quizzes, error} = await sb.from('quizzes')
    .select('*')
    .eq('live_code', code)
    .eq('is_live', true);

  loading(false);

  if(error||!quizzes?.length){
    errEl.textContent='Código não encontrado ou questionário já não está activo.';
    return;
  }

  activeQuiz = quizzes[0];
  document.getElementById('tag-code').textContent = code;
  document.getElementById('session-tag').style.display='flex';
  document.getElementById('btmbar').style.display='flex';

  // Verifica se já respondeu
  const {data:existing} = await sb.from('responses')
    .select('id')
    .eq('quiz_id', activeQuiz.id)
    .eq('user_id', user.id)
    .maybeSingle();

  answered = !!existing;
  showQuestion();
  subscribeQuizChanges();
};

// ── MONITORIZAR MUDANÇAS NO QUIZ ──────────────────────────
// Se o apresentador parar ou iniciar um novo questionário com o mesmo ID

function subscribeQuizChanges(){
  if(quizSub){ sb.removeChannel(quizSub); quizSub=null; }
  quizSub = sb.channel('quiz-'+activeQuiz.id)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'quizzes',filter:`id=eq.${activeQuiz.id}`},
      async (payload)=>{
        activeQuiz = payload.new;
        if(!activeQuiz.is_live){
          // Apresentador parou — mostra ecrã de espera
          sc('sc-wait');
        } else {
          // Reactivou (novo live_code possível ou reset)
          const {data:ex} = await sb.from('responses')
            .select('id').eq('quiz_id',activeQuiz.id).eq('user_id',user.id).maybeSingle();
          answered = !!ex;
          showQuestion();
        }
      })
    .subscribe();
}

// ── MOSTRAR PERGUNTA ──────────────────────────────────────

function showQuestion(){
  selAnswer = null;
  sc('sc-question');
  const wrap = document.getElementById('q-wrap');

  if(answered){
    wrap.innerHTML = doneHTML();
    return;
  }

  const q = activeQuiz;
  const labels={multiple_choice:'Múltipla escolha',word_cloud:'Nuvem de palavras',open_text:'Pergunta aberta',rating:'Escala de avaliação'};
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  let bodyHTML='';

  if(q.type==='multiple_choice'){
    const opts=q.options||[];
    bodyHTML=`<div class="mc-list">${opts.map((o,i)=>`
      <div class="mc-opt" data-v="${esc(o)}" onclick="pickMC(this,'${esc(o)}')">
        <span class="mc-letter">${letters[i]}</span>${o}
      </div>`).join('')}</div>`;
  }

  if(q.type==='word_cloud'){
    bodyHTML=`<div class="text-area">
      <input class="word-input" type="text" id="ans-input" maxlength="30" placeholder="Uma palavra..." oninput="selAnswer=this.value.trim();toggleSubmit()">
    </div>`;
  }

  if(q.type==='open_text'){
    bodyHTML=`<div class="text-area">
      <textarea id="ans-input" placeholder="A tua resposta..." oninput="selAnswer=this.value.trim();toggleSubmit()"></textarea>
    </div>`;
  }

  if(q.type==='rating'){
    const max=q.rating_max||5;
    const btns=Array.from({length:max},(_,i)=>i+1).map(n=>
      `<button class="r-btn" data-v="${n}" onclick="pickRating(this,${n})">${n}</button>`
    ).join('');
    bodyHTML=`<div class="rating-row">${btns}</div>`;
  }

  wrap.innerHTML=`
    <div class="q-card">
      <span class="q-type-tag qt-${q.type}">${labels[q.type]||q.type}</span>
      <div class="q-text">${q.question}</div>
      ${bodyHTML}
    </div>
    <button class="btn-submit" id="btn-submit" disabled onclick="submit()">Enviar resposta</button>
  `;
}

function doneHTML(){
  return `<div class="done-card">
    <div class="done-icon">✓</div>
    <h3>Resposta enviada!</h3>
    <p>Aguarda o próximo questionário do apresentador.</p>
  </div>`;
}

// ── INTERACÇÕES ───────────────────────────────────────────

window.pickMC=(el,val)=>{
  document.querySelectorAll('.mc-opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  selAnswer=val;
  toggleSubmit();
};

window.pickRating=(el,val)=>{
  document.querySelectorAll('.r-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
  selAnswer=String(val);
  toggleSubmit();
};

window.toggleSubmit=()=>{
  const btn=document.getElementById('btn-submit');
  if(btn) btn.disabled=!selAnswer;
};

window.submit=async()=>{
  const answer = selAnswer || document.getElementById('ans-input')?.value?.trim();
  if(!answer) return;
  document.getElementById('btn-submit').disabled=true;
  loading(true);
  const {error}=await sb.from('responses').insert({
    quiz_id: activeQuiz.id,
    user_id: user.id,
    user_name: profile?.name || user.email,
    answer
  });
  loading(false);
  if(error){
    if(error.code==='23505'){ answered=true; } // já respondeu (unique constraint)
    else { document.getElementById('btn-submit').disabled=false; return; }
  } else {
    answered=true;
  }
  document.getElementById('q-wrap').innerHTML=doneHTML();
};

// ── NAV ───────────────────────────────────────────────────

window.leaveSession=()=>{
  if(quizSub){sb.removeChannel(quizSub);quizSub=null;}
  activeQuiz=null;answered=false;selAnswer=null;
  document.getElementById('session-tag').style.display='none';
  document.getElementById('btmbar').style.display='none';
  document.getElementById('join-code').value='';
  document.getElementById('join-err').textContent='';
  sc('sc-join');
};

window.logout=async()=>{await sb.auth.signOut();location.href='index.html';};

// ── UTILS ─────────────────────────────────────────────────

function sc(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById(id)?.classList.add('on');
}
function loading(v){document.getElementById('loader').classList.toggle('on',v);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

document.getElementById('join-code').addEventListener('keydown',e=>{if(e.key==='Enter')window.joinByCode();});
</script>
</body>
</html>
