<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxer — Apresentador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0c0c0f;--surface:#141418;--border:#262630;--text:#e8e6e0;--muted:#5a5870;--accent:#f0b429;--red:#f05a5a;}
body{font-family:'Fira Code',monospace;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;position:relative;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(240,180,41,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(240,180,41,.04) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;}
body::after{content:'';position:fixed;top:-40%;left:-20%;width:60%;height:80%;background:radial-gradient(ellipse,rgba(61,158,255,.06) 0%,transparent 70%);pointer-events:none;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:2.8rem;letter-spacing:-.03em;margin-bottom:.2rem;position:relative;z-index:1;}
.logo .x{color:var(--accent);}
.tagline{font-size:.7rem;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-bottom:2.5rem;position:relative;z-index:1;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2.25rem;width:100%;max-width:380px;position:relative;z-index:1;animation:up .35s ease both;}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:2rem;}
.tab{flex:1;padding:.65rem;background:none;border:none;font-family:'Fira Code',monospace;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.fg{margin-bottom:1.1rem;}
label{display:block;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.35rem;}
input{width:100%;padding:.7rem .9rem;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:'Fira Code',monospace;font-size:.85rem;outline:none;transition:border-color .2s;}
input:focus{border-color:rgba(240,180,41,.5);}
.btn{width:100%;padding:.85rem;background:var(--accent);color:var(--bg);border:none;border-radius:3px;font-family:'Syne',sans-serif;font-weight:700;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .2s;margin-top:.25rem;}
.btn:hover{filter:brightness(1.08);}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
.err{color:var(--red);font-size:.72rem;text-align:center;margin-top:.65rem;min-height:1em;}
.panel{display:none;}.panel.on{display:block;}
.audience-link{
  margin-top:1.5rem;padding:1rem;
  background:rgba(240,180,41,.06);border:1px solid rgba(240,180,41,.2);
  border-radius:3px;text-align:center;
}
.audience-link p{font-size:.65rem;color:var(--muted);letter-spacing:.08em;margin-bottom:.4rem;}
.audience-link a{color:var(--accent);font-size:.75rem;text-decoration:none;}
.audience-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="logo">Vo<span class="x">x</span>er</div>
<p class="tagline">Área do apresentador</p>
<div class="card">
  <div class="tabs">
    <button class="tab active" onclick="tab('login')">Entrar</button>
    <button class="tab" onclick="tab('reg')">Registar</button>
  </div>
  <div id="p-login" class="panel on">
    <div class="fg"><label>Email</label><input id="l-email" type="email" placeholder="tu@email.com"></div>
    <div class="fg"><label>Palavra-passe</label><input id="l-pass" type="password" placeholder="••••••••"></div>
    <button class="btn" onclick="login()">Entrar</button>
    <p class="err" id="l-err"></p>
  </div>
  <div id="p-reg" class="panel">
    <div class="fg"><label>Nome</label><input id="r-name" type="text" placeholder="O teu nome"></div>
    <div class="fg"><label>Email</label><input id="r-email" type="email" placeholder="tu@email.com"></div>
    <div class="fg"><label>Palavra-passe</label><input id="r-pass" type="password" placeholder="mínimo 6 caracteres"></div>
    <button class="btn" onclick="register()">Criar conta</button>
    <p class="err" id="r-err"></p>
  </div>
  <div class="audience-link">
    <p>A audiência não precisa de conta:</p>
    <a href="audience.html">audience.html → entrar com código</a>
  </div>
</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://afdesdgltdsfwkburmuc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmZGVzZGdsdGRzZndrYnVybXVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM0MzcwMTgsImV4cCI6MjA4OTAxMzAxOH0.bdyHF7EODlXW0GyKLdeKLzsmIGNGGc3qC13ogM5amEY';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

sb.auth.getSession().then(({data:{session}})=>{ if(session) location.href='presenter.html'; });

window.tab=(t)=>{
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',(i===0&&t==='login')||(i===1&&t==='reg')));
  document.getElementById('p-login').classList.toggle('on',t==='login');
  document.getElementById('p-reg').classList.toggle('on',t==='reg');
};
window.login=async()=>{
  const email=document.getElementById('l-email').value.trim();
  const pass=document.getElementById('l-pass').value;
  const err=document.getElementById('l-err');
  err.textContent='';
  if(!email||!pass){err.textContent='Preenche todos os campos.';return;}
  document.querySelector('#p-login .btn').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){err.textContent=pt(error.message);document.querySelector('#p-login .btn').disabled=false;return;}
  location.href='presenter.html';
};
window.register=async()=>{
  const name=document.getElementById('r-name').value.trim();
  const email=document.getElementById('r-email').value.trim();
  const pass=document.getElementById('r-pass').value;
  const err=document.getElementById('r-err');
  err.textContent='';
  if(!name||!email||!pass){err.textContent='Preenche todos os campos.';return;}
  document.querySelector('#p-reg .btn').disabled=true;
  const {error}=await sb.auth.signUp({email,password:pass,options:{data:{name}}});
  if(error){err.textContent=pt(error.message);document.querySelector('#p-reg .btn').disabled=false;return;}
  setTimeout(()=>location.href='presenter.html',800);
};
function pt(msg){
  if(msg.includes('Invalid login'))return'Email ou palavra-passe incorrectos.';
  if(msg.includes('already registered'))return'Este email já está registado.';
  if(msg.includes('Password should'))return'Mínimo 6 caracteres.';
  return msg;
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(document.getElementById('p-login').classList.contains('on'))window.login();
  else window.register();
});
</script>
</body>
</html>
